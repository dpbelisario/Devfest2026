[project]
name = "devfest-api"
version = "0.1.0"
description = "DevFest 2026 hackathon API (FastAPI on Cloud Run)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
