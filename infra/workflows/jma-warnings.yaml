# Cloud Workflows: JMA weather and disaster updates.
# Replaces n8n workflow 2 ("Evacuation-AR | 02 JMA weather and disaster updates").
# Step names mirror the n8n nodes so the console graph reads the same way.
#
# Three branches run in parallel, as in n8n: Aichi weather warnings, nationwide
# earthquake/tsunami/volcano bulletins, and the warning handoff outbox.
# All feed parsing, deduplication and storage live in the contour-jobs backend.
# Base URL: runtime argument {"baseUrl": "https://..."} or the deploy-time
# environment variable JOBS_BASE_URL (set by infra/deploy-workflows.sh).
# Optional argument {"mode": "recent" | "recovery"} overrides the schedule rule.
# Trigger: Cloud Scheduler job jma-warnings-every-minute (created paused).
# Docs: docs/cloud-jobs.md. Outbox delivery stays disabled in the backend.

main:
  params: [args]
  steps:
    - import_configuration:
        assign:
          - noArgs: {}
          - input: ${default(args, noArgs)}
          - baseUrl: ${default(map.get(input, "baseUrl"), sys.get_env("JOBS_BASE_URL", ""))}
          - requestedMode: ${default(map.get(input, "mode"), "")}
          - startedAt: ${sys.now()}
          - nowTokyo: ${time.format(startedAt, "Asia/Tokyo")}
          - mode: recent
          # Written by the parallel branches below.
          - weatherResult: null
          - eqvolResults: []
          - eqvolCandidateCount: 0
          - outboxResult: null
    - check_configuration:
        switch:
          - condition: ${baseUrl == ""}
            raise:
              error: MISSING_CONFIGURATION
              message: Set JOBS_BASE_URL on the workflow or pass {"baseUrl"} as the argument.

    # n8n: Download recent feed or hourly recovery. Minute 00 (Asia/Tokyo) reads
    # the long recovery feeds to catch anything missed; other minutes read recent.
    - recent_feed_or_hourly_recovery:
        switch:
          - condition: ${requestedMode == "recent" or requestedMode == "recovery"}
            steps:
              - use_requested_mode:
                  assign:
                    - mode: ${requestedMode}
          - condition: ${text.substring(nowTokyo, 14, 16) == "00"}
            steps:
              - use_hourly_recovery:
                  assign:
                    - mode: recovery

    - collect_updates:
        try:
          steps:
            - fan_out_feeds:
                parallel:
                  shared:
                    [
                      weatherResult,
                      eqvolResults,
                      eqvolCandidateCount,
                      outboxResult,
                    ]
                  branches:
                    # n8n: Parse Atom XML -> Select Aichi bulletins -> Skip seen or older bulletin
                    #   -> Download official bulletin -> Validate municipality statuses
                    #   -> Queue weather handoff -> Save/Publish Aichi snapshot
                    - aichi_weather_warnings:
                        steps:
                          - select_aichi_bulletins:
                              try:
                                call: http.post
                                args:
                                  url: ${baseUrl + "/jobs/jma/weather/check"}
                                  auth:
                                    type: OIDC
                                    audience: ${baseUrl}
                                  body:
                                    mode: ${mode}
                                  timeout: 15
                                result: weatherCheck
                              retry:
                                predicate: ${retry_server_error_or_timeout}
                                max_retries: 2
                                backoff:
                                  initial_delay: 1
                                  max_delay: 4
                                  multiplier: 2
                          - new_aichi_bulletin:
                              switch:
                                - condition: ${map.get(weatherCheck.body, "candidate") != null}
                                  steps:
                                    - validate_municipality_statuses:
                                        try:
                                          call: http.post
                                          args:
                                            url: ${baseUrl + "/jobs/jma/weather/process"}
                                            auth:
                                              type: OIDC
                                              audience: ${baseUrl}
                                            body:
                                              candidate: ${weatherCheck.body.candidate}
                                            timeout: 20
                                          result: weatherProcess
                                        retry:
                                          predicate: ${http.default_retry_predicate_non_idempotent}
                                          max_retries: 1
                                          backoff:
                                            initial_delay: 1
                                            max_delay: 2
                                            multiplier: 2
                                    - warning_import_summary:
                                        assign:
                                          - weatherResult: ${weatherProcess.body}

                    # n8n: Parse earthquake volcano Atom -> Select unseen earthquake tsunami volcano
                    #   -> Process each disaster bulletin -> Normalize -> Queue disaster handoff
                    #   -> Store disaster bulletin
                    - earthquake_tsunami_volcano:
                        steps:
                          - select_unseen_earthquake_tsunami_volcano:
                              try:
                                call: http.post
                                args:
                                  url: ${baseUrl + "/jobs/jma/eqvol/check"}
                                  auth:
                                    type: OIDC
                                    audience: ${baseUrl}
                                  body:
                                    mode: ${mode}
                                  timeout: 15
                                result: eqvolCheck
                              retry:
                                predicate: ${retry_server_error_or_timeout}
                                max_retries: 2
                                backoff:
                                  initial_delay: 1
                                  max_delay: 4
                                  multiplier: 2
                          - read_candidates:
                              assign:
                                - noCandidates: []
                                - candidates: ${default(map.get(eqvolCheck.body, "candidates"), noCandidates)}
                                - eqvolCandidateCount: ${len(candidates)}
                          - process_each_disaster_bulletin:
                              for:
                                value: candidate
                                in: ${candidates}
                                steps:
                                  # Leave the rest for the next minute's run (still unseen there).
                                  - time_budget_left:
                                      switch:
                                        - condition: ${sys.now() - startedAt > 40}
                                          next: break
                                  - normalize_earthquake_tsunami_volcano:
                                      try:
                                        call: http.post
                                        args:
                                          url: ${baseUrl + "/jobs/jma/eqvol/process"}
                                          auth:
                                            type: OIDC
                                            audience: ${baseUrl}
                                          body:
                                            candidate: ${candidate}
                                          timeout: 15
                                        result: eqvolProcess
                                      retry:
                                        predicate: ${http.default_retry_predicate_non_idempotent}
                                        max_retries: 1
                                        backoff:
                                          initial_delay: 1
                                          max_delay: 2
                                          multiplier: 2
                                  - disaster_import_summary:
                                      assign:
                                        - eqvolResults: ${list.concat(eqvolResults, eqvolProcess.body)}

                    # n8n: Cloud Run delivery configuration -> Read pending warning handoffs
                    #   -> Deliver each warning handoff (delivery is disabled in the backend)
                    - deliver_warning_handoffs:
                        steps:
                          - send_warning_to_cloud_run:
                              try:
                                call: http.post
                                args:
                                  url: ${baseUrl + "/jobs/outbox/deliver"}
                                  auth:
                                    type: OIDC
                                    audience: ${baseUrl}
                                  body: {}
                                  timeout: 20
                                result: outboxResponse
                              retry:
                                predicate: ${http.default_retry_predicate_non_idempotent}
                                max_retries: 1
                                backoff:
                                  initial_delay: 1
                                  max_delay: 2
                                  multiplier: 2
                          - warning_handoff_summary:
                              assign:
                                - outboxResult: ${outboxResponse.body}
        except:
          as: e
          steps:
            - report_failed_branches:
                raise:
                  error: BRANCH_FAILED
                  message: At least one branch failed; results from the others are attached.
                  mode: ${mode}
                  cause: ${e}
                  weather: ${weatherResult}
                  eqvol: ${eqvolResults}
                  outbox: ${outboxResult}

    - update_summary:
        return:
          mode: ${mode}
          startedAt: ${nowTokyo}
          elapsedSeconds: ${sys.now() - startedAt}
          weather: ${weatherResult}
          eqvol: ${eqvolResults}
          eqvolDeferred: ${eqvolCandidateCount - len(eqvolResults)}
          outbox: ${outboxResult}

# Retry on HTTP 5xx, timeouts and connection failures. Never retries 4xx.
retry_server_error_or_timeout:
  params: [e]
  steps:
    - read_error:
        assign:
          - noTags: []
          - code: ${default(map.get(e, "code"), 0)}
          - tags: ${default(map.get(e, "tags"), noTags)}
    - classify_error:
        switch:
          - condition: ${code >= 500 and code <= 599}
            return: true
          - condition: ${"TimeoutError" in tags or "ConnectionError" in tags or "ConnectionFailedError" in tags}
            return: true
    - do_not_retry:
        return: false
